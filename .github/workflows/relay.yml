name: Ghosty Native Autopilot Relay Chain

on:
  workflow_run:
    workflows: ["Ghosty Precision Single-Interval Scheduler"]
    types:
      - completed

jobs:
  trigger_next_shift:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Next Automated Loop Row
        uses: actions/github-script@v7
        with:
          # 🔑 BYPASS PROTOCOL: Uses your BOT_PAT secret to securely bypass GitHub's loop restrictions!
          github-token: ${{ secrets.BOT_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'schedule.yml',
              ref: 'main'
            });
