name: Ghosty High-Priority On-Demand Scheduler

on:
  # 🎯 BYPASS QUEUE: Listens for a direct external API ping to force an instant, high-priority server boot!
  repository_dispatch:
    types: [trigger_precision_bot]

jobs:
  run_precision_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Precision Loop
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py
