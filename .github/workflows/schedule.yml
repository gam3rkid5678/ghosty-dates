name: Ghosty Fixed 1-Hour Shift Scheduler

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_next_shift]

jobs:
  run_precision_bot:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 🪓 THE AXE: Instantly cancels overlapping instances before the python script boots
      - name: Cancel Overlapping Active Runners
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              status: 'in_progress'
            });
            for (const run of runs.workflow_runs) {
              if (run.id !== context.runId && run.name === context.workflow) {
                console.log(`Forcefully canceling old overlapping run: ${run.id}`);
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
              }
            }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute 55-Minute Precision Loop
        env:
          DISCORD_WEBHOOK_URL: \${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py

      # 🚀 THE NATIVE HANDOFF: Uses clean github-script to cleanly wake up the next hour's shift container!
      - name: Auto-Trigger Next Hour Shift
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            console.log("Triggering next 1-hour shift container...");
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'schedule.yml',
              ref: 'main'
            });
