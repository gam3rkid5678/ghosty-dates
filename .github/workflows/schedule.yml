name: Ghosty Precision Single-Interval Scheduler

on:
  workflow_dispatch:
  schedule:
    # 🎯 HIGH-FREQUENCY AUTO TRACK: Automatically sweeps every 15 minutes continuous
    - cron: '0,15,30,45 * * * *'

jobs:
  run_precision_bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Precision Loop
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py

      # 🛡️ IMMORTALITY SHIELD: Bumps your repository database history automatically to bypass new-account delay pools permanently!
      - name: Keep Github Actions Alive Natively
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true
